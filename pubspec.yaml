name: davai_store
description: "A new Flutter project."

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  flutter_svg: ^2.3.0
  smooth_page_indicator: ^2.0.1
  flutter_hooks: ^0.21.3+1
  hooks: ^2.0.0
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  slang: ^4.16.0
  slang_flutter: ^4.16.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  http: ^1.6.0
  dio: ^5.11.0
  lottie: ^3.3.3
  intl_phone_field: ^3.2.0
  pinput: ^6.0.2
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/appLogo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
